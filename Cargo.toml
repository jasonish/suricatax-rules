[package]
name = "suricasta-rules"
license = "AGPL-3.0-only"
version = "0.4.0"
edition = "2021"
description = "Suricata Rule Manager"
rust-version = "1.85.0"
homepage = "https://github.com/jasonish/suricasta-rules"

[dependencies]
# MSRV notes for intentionally older transitive versions in Cargo.lock:
# - idna_adapter 1.2.1 and ICU4X 2.1.x are the newest releases supporting
#   Rust 1.85; later releases require Rust 1.86 and 1.88, respectively.
# - deflate64 must remain below 0.1.11 because newer releases use standard
#   library APIs that are unavailable on Rust 1.85.
clap = { version = "4.6", features = ["derive", "color"] }
colored = "2.2"
directories = "5.0"
inquire = "0.9"
# Select Ring separately so reqwest does not choose a TLS provider.
reqwest = { version = "0.13", default-features = false, features = ["blocking", "rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
serde = { version = "1.0", features = ["derive"] }
serde_yaml = "0.9"
anyhow = "1.0"
tar = "0.4"
flate2 = "1.1"
# Exclude zip's vulnerable `time` feature while retaining archive compression support.
zip = { version = "2.4", default-features = false, features = ["bzip2", "deflate", "deflate64", "lzma", "xz", "zstd"] }
md5 = "0.7"
regex = "1.13"
chrono = "0.4"
indicatif = "0.18"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"
