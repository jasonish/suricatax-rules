[package]
name = "suricatax-rules"
license = "MIT"
version = "0.5.0"
edition = "2021"
description = "Suricata Rule Manager"
rust-version = "1.85.0"
homepage = "https://github.com/jasonish/suricatax-rules"

[dependencies]
# Cargo.lock keeps idna_adapter at 1.2.1 and ICU4X at 2.1.x for Rust 1.85.
clap = { version = "4.6", features = ["derive", "color"] }
colored = "2.2"
directories = "5.0"
inquire = "0.9"
# Select Ring separately so reqwest does not choose a TLS provider.
reqwest = { version = "0.13", default-features = false, features = ["blocking", "rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
serde = { version = "1.0", features = ["derive"] }
# Use the maintained YAML organization fork without changing existing imports.
serde_yaml = { package = "yaml_serde", version = "0.10.7" }
anyhow = "1.0"
tar = "0.4"
flate2 = "1.1"
# ZIP parsing and codecs compatible with Suricata's Rust 1.85 MSRV.
rawzip = "0.5.2"
bzip2 = "0.6"
# Later deflate64 releases use standard-library APIs newer than Rust 1.85.
deflate64 = "=0.1.10"
# Keep XZ's SHA-256 implementation compatible with Rust 1.85.
lzma-rust2 = { version = "0.14.3", default-features = false, features = ["std", "xz"] }
oem_cp = { version = "2.1", default-features = false }
zstd = "0.13"
md5 = "0.7"
regex = "1.13"
chrono = "0.4"
indicatif = "0.18"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"
